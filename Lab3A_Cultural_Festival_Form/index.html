<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cultural Festival Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌏 Cultural Fest 2026</h1>
      <p>Registration Form for Participants</p>
    </header>

    <form action="#" method="post">
      <fieldset>
        <legend>Personal Information</legend>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit phone number" pattern="[0-9]{10}" required>

        <label for="institution">Institution</label>
        <input type="text" id="institution" name="institution" placeholder="College / University" required>
      </fieldset>

      <fieldset>
        <legend>Participant Details</legend>

        <label>Gender</label>
        <div class="inline">
          <label><input type="radio" name="gender" value="male" required> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div>

        <label for="event">Select Event</label>
        <select id="event" name="event" required>
          <option value="">-- Choose an event --</option>
          <option>Classical Dance</option>
          <option>Folk Dance</option>
          <option>Music</option>
          <option>Drama</option>
          <option>Painting</option>
          <option>Quiz</option>
        </select>

        <label>Interests</label>
        <div class="checks">
          <label><input type="checkbox" name="interest" value="dance"> Dance</label>
          <label><input type="checkbox" name="interest" value="music"> Music</label>
          <label><input type="checkbox" name="interest" value="art"> Art</label>
          <label><input type="checkbox" name="interest" value="literature"> Literature</label>
        </div>

        <label for="message">About Your Performance</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us briefly about your performance..."></textarea>
      </fieldset>

      <div class="buttons">
        <button type="submit">Submit Registration</button>
        <button type="reset">Reset Form</button>
      </div>
    </form>
  </div>
</body>
</html>
