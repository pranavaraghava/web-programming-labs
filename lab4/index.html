<!DOCTYPE html>
<html>
<head>
    <title>Country and Capital</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        select {
            padding: 10px;
            font-size: 18px;
        }

        #capital {
            color: blue;
            font-size: 22px;
            font-weight: bold;
            margin-left: 20px;
        }
    </style>

    <script>
        function showCapital() {
            var country = document.getElementById("country").value;
            var capital = document.getElementById("capital");

            if (country == "India") {
                capital.innerHTML = "Capital: New Delhi";
            }
            else if (country == "USA") {
                capital.innerHTML = "Capital: Washington, D.C.";
            }
            else if (country == "UK") {
                capital.innerHTML = "Capital: London";
            }
            else if (country == "Japan") {
                capital.innerHTML = "Capital: Tokyo";
            }
            else if (country == "France") {
                capital.innerHTML = "Capital: Paris";
            }
            else {
                capital.innerHTML = "";
            }
        }
    </script>
</head>

<body>

    <h1>Select a Country</h1>

    <select id="country" onchange="showCapital()">
        <option value="">-- Select Country --</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
        <option value="UK">United Kingdom</option>
        <option value="Japan">Japan</option>
        <option value="France">France</option>
    </select>

    <span id="capital"></span>

</body>
</html>
