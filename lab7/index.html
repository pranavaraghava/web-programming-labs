
<!DOCTYPE html>
<html>
<head>
    <title>Mathematical Calculator</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input, select, button {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            font-weight: bold;
            color: green;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mathematical Calculator</h2>

        <form onsubmit="calculate(event)">
            <input type="number" id="num1" placeholder="Enter First Number" step="any" required>

            <input type="number" id="num2" placeholder="Enter Second Number" step="any" required>

            <select id="operation">
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (-)</option>
                <option value="multiply">Multiplication (*)</option>
                <option value="divide">Division (/)</option>
            </select>

            <button type="submit">Calculate</button>
        </form>

        <p id="result">Result will appear here</p>
    </div>

    <script>
        function calculate(event) {
            event.preventDefault();

            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);
            let op = document.getElementById("operation").value;

            let result;

            switch(op) {
                case "add":
                    result = a + b;
                    break;

                case "subtract":
                    result = a - b;
                    break;

                case "multiply":
                    result = a * b;
                    break;

                case "divide":
                    if (b === 0) {
                        result = "Cannot divide by zero";
                    } else {
                        result = a / b;
                    }
                    break;
            }

            document.getElementById("result").innerHTML =
                "Result: " + result;
        }
    </script>

</body>
</html>
