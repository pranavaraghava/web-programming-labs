
<!DOCTYPE html>
<html>
<head>
    <title>Display User Information</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        td:first-child {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>User Information</h2>

    <table id="details"></table>
</div>

<script>
    let user = JSON.parse(sessionStorage.getItem("userData"));

    if (user) {
        let table = document.getElementById("details");

        for (let key in user) {
            let row = table.insertRow();

            let cell1 = row.insertCell(0);
            let cell2 = row.insertCell(1);

            cell1.textContent =
                key.charAt(0).toUpperCase() + key.slice(1);

            cell2.textContent = user[key];
        }
    } else {
        document.getElementById("details").textContent =
            "No user information found.";
    }
</script>

</body>
</html>
